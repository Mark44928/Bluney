# Bluney light — yazi theme.toml
# Install: cp yazi/bluney-light.toml ~/.config/yazi/theme.toml
# Dark/light variants are separate files since yazi auto-loads theme-dark.toml /
# theme-light.toml based on terminal color mode.

[flavor]
dark = ""
light = ""

[app]
overall = { fg = "#1E2F45", bg = "#F0F5FB" }

[mgr]
cwd = { fg = "#2F6FB8", bold = true }
find_keyword = { fg = "#7A5F1A", bold = true, italic = true, underline = true }
find_position = { fg = "#2F5E9E", bg = "reset", bold = true, italic = true }
symlink_target = { italic = true }
marker_copied = { fg = "#2F6FB8", bg = "#2F6FB8" }
marker_cut = { fg = "#AE4A42", bg = "#AE4A42" }
marker_marked = { fg = "#1B6E8A", bg = "#1B6E8A" }
marker_selected = { fg = "#7A5F1A", bg = "#7A5F1A" }
count_copied = { fg = "#F0F5FB", bg = "#2F6FB8" }
count_cut = { fg = "#F0F5FB", bg = "#AE4A42" }
count_selected = { fg = "#F0F5FB", bg = "#7A5F1A" }
border_symbol = "│"
border_style = { fg = "#5A6F8A" }

[tabs]
active = { bg = "#2F6FB8", bold = true }
inactive = { fg = "#5A6F8A", bg = "#F0F5FB" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "#2F6FB8", bold = true }
normal_alt = { fg = "#2F6FB8", bg = "#E3EAF6" }
select_main = { bg = "#AE4A42", bold = true }
select_alt = { fg = "#AE4A42", bg = "#E3EAF6" }
unset_main = { bg = "#AE4A42", bold = true }
unset_alt = { fg = "#AE4A42", bg = "#E3EAF6" }

[status]
overall = { fg = "#1E2F45", bg = "#E3EAF6" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#2F6FB8" },
	{ mime = "{audio,video}/*", fg = "#2F5E9E" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#AE4A42" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#1B6E8A" },
	{ mime = "vfs/{absent,stale}", fg = "#5A6F8A" },
	{ url = "*", is = "orphan", bg = "#AE4A42" },
	{ url = "*", is = "exec", fg = "#2F6FB8" },
	{ url = "*", is = "dummy", bg = "#AE4A42" },
	{ url = "*/", fg = "#2F5E9E" }
]
