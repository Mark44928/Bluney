# Bluney light — tmux theme
# Source: tmux source-file "$HOME/Bluney/tmux/bluney-light.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#1E2F45,bg=#E3EAF6"
set -g window-status-style "fg=#5A6F8A"
set -g window-status-current-style "fg=#F0F5FB,bg=#2F6FB8,bold"
set -g window-status-activity-style "fg=#6B5AA8,bg=#F0F5FB"
set -g window-status-bell-style "fg=#C0574E,bg=#F0F5FB"
set -g pane-border-style "fg=#5A6F8A"
set -g pane-active-border-style "fg=#2F6FB8"
set -g message-style "fg=#1E2F45,bg=#E3EAF6"
set -g message-command-style "fg=#1E2F45,bg=#E3EAF6"
set -g mode-style "fg=#F0F5FB,bg=#2F6FB8,bold"
set -g display-panes-active-colour "#2F6FB8"
set -g display-panes-colour "#5A6F8A"
set -g clock-mode-colour "#2F6FB8"
set -g status-left "#[fg=#F0F5FB,bg=#2F6FB8,bold] #S #[default]"
set -g status-right "#[fg=#5A6F8A] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
