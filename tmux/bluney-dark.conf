# Bluney dark — tmux theme
# Source: tmux source-file "$HOME/Bluney/tmux/bluney-dark.conf"
# Hex #RRGGBB colour values (tmux converts to nearest 256-colour slot).

set -g status "on"
set -g status-style "fg=#D5E5F2,bg=#152A45"
set -g window-status-style "fg=#7E9BB8"
set -g window-status-current-style "fg=#0E1B2E,bg=#7DBBFF,bold"
set -g window-status-activity-style "fg=#B9A8E0,bg=#0E1B2E"
set -g window-status-bell-style "fg=#E18B8B,bg=#0E1B2E"
set -g pane-border-style "fg=#7E9BB8"
set -g pane-active-border-style "fg=#7DBBFF"
set -g message-style "fg=#D5E5F2,bg=#152A45"
set -g message-command-style "fg=#D5E5F2,bg=#152A45"
set -g mode-style "fg=#0E1B2E,bg=#7DBBFF,bold"
set -g display-panes-active-colour "#7DBBFF"
set -g display-panes-colour "#7E9BB8"
set -g clock-mode-colour "#7DBBFF"
set -g status-left "#[fg=#0E1B2E,bg=#7DBBFF,bold] #S #[default]"
set -g status-right "#[fg=#7E9BB8] %H:%M #[default]"
set -g status-left-length 100
set -g status-right-length 100
