# Bluney light — lsd colors theme
# Install: cp lsd/bluney-light.colors.yaml ~/.config/lsd/colors.yaml
# Enable in ~/.config/lsd/config.yaml:
#   color:
#     theme: custom
#
# Hex #RRGGBB values supported by lsd.

user: "#1E2F45"
group: "#2F5E9E"
permission:
  read: "#2F6FB8"
  write: "#8A6D1F"
  exec: "#1F7E9E"
  exec-sticky: "#6B5AA8"
  no-access: "#5A6F8A"
  octal: "#5A6F8A"
  acl: "#1F7E9E"
  context: "#2F5E9E"
date:
  hour-old: "#2F6FB8"
  day-old: "#2F5E9E"
  older: "#5A6F8A"
size:
  none: "#5A6F8A"
  small: "#2F6FB8"
  medium: "#8A6D1F"
  large: "#6B5AA8"
inode:
  valid: "#2F5E9E"
  invalid: "#5A6F8A"
links:
  valid: "#2F5E9E"
  invalid: "#5A6F8A"
tree-edge: "#5A6F8A"
git-status:
  default: "#5A6F8A"
  unmodified: "#5A6F8A"
  ignored: "#5A6F8A"
  new-in-index: "#2F6FB8"
  new-in-workdir: "#2F6FB8"
  typechange: "#8A6D1F"
  deleted: "#C0574E"
  renamed: "#2F6FB8"
  modified: "#8A6D1F"
  conflicted: "#C0574E"
