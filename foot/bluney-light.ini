# Bluney light — foot terminal theme
# foot reads themes from ~/.config/foot/foot.ini. Drop this file in as
# foot.ini (or include it with `include=~/.config/foot/bluney-light.ini`).
# Colors are hex without the leading '#' (INI has no comments mid-value).
[colors]
background=F0F5FB
foreground=1E2F45
cursor=1E2F45
selection-background=E3EAF6
selection-foreground=1E2F45

regular0=E3EAF6
regular1=AE4A42
regular2=2F6FB8
regular3=7A5F1A
regular4=2F5E9E
regular5=6B5AA8
regular6=1B6E8A
regular7=1E2F45
bright0=5A6F8A
bright1=D0705F
bright2=4F8FD4
bright3=A08428
bright4=5B7FC4
bright5=8B7FD4
bright6=3E9EB8
bright7=FFFFFF
