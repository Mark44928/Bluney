# Bluney dark — foot terminal theme
# foot reads themes from ~/.config/foot/foot.ini. Drop this file in as
# foot.ini (or include it with `include=~/.config/foot/bluney-dark.ini`).
# Colors are hex without the leading '#' (INI has no comments mid-value).
[colors]
background=0E1B2E
foreground=D5E5F2
cursor=D5E5F2
selection-background=152A45
selection-foreground=D5E5F2

regular0=16283E
regular1=E18B8B
regular2=7DBBFF
regular3=E0CD97
regular4=4F8FE0
regular5=B9A8E0
regular6=7FD7F2
regular7=D5E5F2
bright0=5F7E9E
bright1=F0A8A8
bright2=A8D4FF
bright3=EBDFA8
bright4=7FA9E8
bright5=CDBEF0
bright6=A8E8F8
bright7=FFFFFF
