<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Bluney</title>
  <desc id="d">Bluney — Greenit's blue sibling. An ice-blue droplet with ripples beside the BLUNEY wordmark.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122A46"/>
      <stop offset="0.55" stop-color="#0E1B2E"/>
      <stop offset="1" stop-color="#091320"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17395F"/>
      <stop offset="1" stop-color="#0F2440"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E4FF"/>
      <stop offset="0.45" stop-color="#7DBBFF"/>
      <stop offset="1" stop-color="#2F6FB8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DBBFF"/>
      <stop offset="1" stop-color="#7DBBFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DBBFF" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#7DBBFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7DBBFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#card)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="27.25" fill="none" stroke="#7DBBFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <g transform="translate(116 50)">
    <rect width="200" height="200" rx="46" fill="url(#tile)" stroke="#7DBBFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="100" cy="102" r="96" fill="url(#glow)" filter="url(#soft)"/>
    <g transform="translate(100 100)">
      <path d="M0,-66
               C 44,-28 50,24 28,58
               C 15,80 -15,80 -28,58
               C -50,24 -44,-28 0,-66 Z"
            fill="url(#drop)" stroke="#071120" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M-14,20 C -6,32 6,32 14,20" fill="none" stroke="#071120" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/>
      <ellipse cx="-12" cy="-20" rx="6" ry="12" transform="rotate(18 -12 -20)" fill="#FFFFFF" opacity="0.35"/>
      <circle cx="0" cy="-56" r="5" fill="#C4E4FF" stroke="#071120" stroke-width="2.2"/>
    </g>
    <g fill="none" stroke="#7DBBFF" stroke-linecap="round" opacity="0.55">
      <path d="M56,168 C 76,178 124,178 144,168" stroke-width="4"/>
      <path d="M46,180 C 74,194 126,194 154,180" stroke-width="3" opacity="0.7"/>
    </g>
  </g>

  <text x="356" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="84" font-weight="800" letter-spacing="11" fill="#E3EFF9">BLUNEY</text>
  <text x="358" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="4.5" fill="#8FAFCF">TERMINAL · EDITOR · SHELL THEMES</text>
  <line x1="358" y1="196" x2="780" y2="196" stroke="url(#edge)" stroke-width="2"/>
  <text x="358" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="1.5" fill="#7393B2">dark + light · 60 artifacts from one palette.json</text>

  <g transform="translate(978 214)">
    <circle cx="0" cy="0" r="11" fill="#7DBBFF"/>
    <circle cx="34" cy="0" r="11" fill="#4F8FE0"/>
    <circle cx="68" cy="0" r="11" fill="#C4E4FF"/>
    <circle cx="102" cy="0" r="11" fill="#B9A8E0"/>
  </g>
  <text x="978" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#5C7C9C">BY MARK44928</text>
</svg>
