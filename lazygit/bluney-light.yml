# Bluney light — lazygit theme
# Install: cp lazygit/bluney-light.yml ~/.config/lazygit/bluney-light.yml
# Load: lazygit --use-config-file ~/.config/lazygit/config.yml,~/.config/lazygit/bluney-light.yml
# Or: LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/bluney-light.yml" lazygit

gui:
  theme:
    activeBorderColor:
      - "#2F6FB8"
      - bold
    inactiveBorderColor:
      - "#5A6F8A"
    searchingActiveBorderColor:
      - "#2F5E9E"
    optionsTextColor:
      - "#2F6FB8"
    selectedLineBgColor:
      - "#E3EAF6"
    inactiveViewSelectedLineBgColor:
      - "#E3EAF6"
    cherryPickedCommitFgColor:
      - "#2F6FB8"
    cherryPickedCommitBgColor:
      - "#E3EAF6"
    markedBaseCommitFgColor:
      - "#2F6FB8"
    markedBaseCommitBgColor:
      - "#7A5F1A"
    unstagedChangesColor:
      - "#AE4A42"
    defaultFgColor:
      - "#1E2F45"
    selectedLineFgColor:
      - "#1E2F45"

  colorScheme: light
