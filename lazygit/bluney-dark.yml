# Bluney dark — lazygit theme
# Install: cp lazygit/bluney-dark.yml ~/.config/lazygit/bluney-dark.yml
# Load: lazygit --use-config-file ~/.config/lazygit/config.yml,~/.config/lazygit/bluney-dark.yml
# Or: LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/bluney-dark.yml" lazygit

gui:
  theme:
    activeBorderColor:
      - "#7DBBFF"
      - bold
    inactiveBorderColor:
      - "#7E9BB8"
    searchingActiveBorderColor:
      - "#4F8FE0"
    optionsTextColor:
      - "#7DBBFF"
    selectedLineBgColor:
      - "#152A45"
    inactiveViewSelectedLineBgColor:
      - "#152A45"
    cherryPickedCommitFgColor:
      - "#7DBBFF"
    cherryPickedCommitBgColor:
      - "#152A45"
    markedBaseCommitFgColor:
      - "#7DBBFF"
    markedBaseCommitBgColor:
      - "#E0CD97"
    unstagedChangesColor:
      - "#E18B8B"
    defaultFgColor:
      - "#D5E5F2"
    selectedLineFgColor:
      - "#D5E5F2"

  colorScheme: dark
